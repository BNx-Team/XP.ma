<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>XP.ma — Login</title>

    <link
        rel="icon"
        type="image/png"
        href="logopng.png"
    >


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 20% 10%,
                    rgba(80,80,80,.35),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 90%,
                    rgba(40,40,40,.4),
                    transparent 30%
                ),
                #050505;
        }


        .back {

            position: fixed;

            top: 25px;

            left: 25px;

            color: #aaa;

            text-decoration: none;

            font-size: 14px;
        }


        .back:hover {
            color: white;
        }


        .card {

            width: 100%;

            max-width: 440px;

            padding: 40px;

            border-radius: 24px;

            background:
                rgba(255,255,255,.06);

            border:
                1px solid rgba(255,255,255,.12);

            backdrop-filter:
                blur(20px);

            box-shadow:
                0 20px 70px rgba(0,0,0,.5);
        }


        .logo {

            text-align: center;

            margin-bottom: 25px;
        }


        .logo img {

            width: 125px;

            max-width: 100%;
        }


        h1 {

            text-align: center;

            font-size: 30px;

            margin-bottom: 10px;
        }


        .subtitle {

            text-align: center;

            color: #888;

            font-size: 14px;

            margin-bottom: 30px;
        }


        .group {

            margin-bottom: 18px;
        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #ccc;

            font-size: 14px;
        }


        input {

            width: 100%;

            padding: 14px 15px;

            border-radius: 11px;

            border:
                1px solid rgba(255,255,255,.12);

            outline: none;

            background:
                rgba(0,0,0,.35);

            color: white;

            font-size: 15px;
        }


        input:focus {

            border-color:
                rgba(255,255,255,.45);
        }


        input::placeholder {

            color: #666;
        }


        button {

            width: 100%;

            padding: 15px;

            margin-top: 5px;

            border: none;

            border-radius: 12px;

            background: white;

            color: black;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: .25s;
        }


        button:hover {

            transform:
                translateY(-2px);

            background: #ddd;
        }


        button:disabled {

            opacity: .6;

            cursor: not-allowed;

            transform: none;
        }


        .message {

            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 10px;

            font-size: 13px;

            line-height: 1.5;
        }


        .success {

            display: block;

            color: #7dffb2;

            background:
                rgba(0,255,120,.08);

            border:
                1px solid rgba(0,255,120,.2);
        }


        .error {

            display: block;

            color: #ff8585;

            background:
                rgba(255,50,50,.08);

            border:
                1px solid rgba(255,50,50,.2);
        }


        .bottom {

            text-align: center;

            margin-top: 25px;

            color: #777;

            font-size: 14px;
        }


        .bottom a {

            color: white;

            font-weight: bold;

            text-decoration: none;
        }

    </style>

</head>


<body>


<a href="index.html" class="back">
    ← Back to XP.ma
</a>


<div class="card">


    <div class="logo">

        <img
            src="assets/logo.png"
            alt="XP.ma"
        >

    </div>


    <h1>
        Welcome back
    </h1>


    <p class="subtitle">
        Sign in to your XP.ma account.
    </p>


    <form id="loginForm">


        <div class="group">

            <label for="username">
                Username
            </label>

            <input
                id="username"
                type="text"
                placeholder="Your username"
                autocomplete="username"
                required
            >

        </div>


        <div class="group">

            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Your password"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            id="loginButton"
            type="submit"
        >
            Sign in →
        </button>


    </form>


    <div
        id="message"
        class="message"
    ></div>


    <div class="bottom">

        Don't have an account?

        <a href="signup.html">
            Create one
        </a>

    </div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    /* ==========================================
       SUPABASE CONFIG
    ========================================== */

    const SUPABASE_URL =
        "https://fiftnztuwqedvjbiuwyo.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_JvMn1Bd1wgpPJ9Mw_Wphzg_TJNInEqR";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    const form =
        document.getElementById("loginForm");

    const button =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");


    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;

    }


    /* ==========================================
       LOGIN
    ========================================== */

    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const username =
                document
                .getElementById("username")
                .value
                .trim()
                .toLowerCase();


            const password =
                document
                .getElementById("password")
                .value;


            button.disabled = true;

            button.textContent =
                "Signing in...";


            try {

                const {
                    data,
                    error
                } =
                await supabaseClient.rpc(
                    "login_xp_user",
                    {
                        p_username: username,
                        p_password: password
                    }
                );


                if (error) {

                    console.error(error);

                    showMessage(
                        "Incorrect username or password.",
                        "error"
                    );

                    return;
                }


                if (!data || !data.success) {

                    showMessage(
                        "Incorrect username or password.",
                        "error"
                    );

                    return;
                }


                /* Save XP.ma session */

                localStorage.setItem(
                    "xp_session",
                    data.token
                );


                localStorage.setItem(
                    "xp_username",
                    data.username
                );


                showMessage(
                    "Login successful! Redirecting...",
                    "success"
                );


                setTimeout(function() {

                    window.location.href =
                        "dashboard.html";

                }, 500);


            } catch (error) {

                console.error(error);

                showMessage(
                    "Something went wrong. Please try again.",
                    "error"
                );

            } finally {

                button.disabled = false;

                button.textContent =
                    "Sign in →";

            }

        }
    );

</script>

</body>

</html>
