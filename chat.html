<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChatXp — XP.ma</title>
<link rel="icon" href="logopng.png">
<style>
:root{--bg:#0a0e1f;--panel:#111733;--panel2:#171e42;--line:#262e5a;--text:#eef0ff;--muted:#a3abd6;--a1:#7c6cff;--a2:#22d3ee;--user:#2a2f6e;--danger:#ff6b81}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--text);background:radial-gradient(900px 500px at 85% -10%,#2b2377 0,transparent 60%),radial-gradient(700px 500px at -10% 110%,#0b4a63 0,transparent 55%),var(--bg);display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
/* sidebar */
.side{width:280px;flex:none;background:rgba(17,23,51,.85);backdrop-filter:blur(14px);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:12px;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.brand img{width:34px;height:34px;border-radius:9px;object-fit:contain;background:#fff}
.new{background:linear-gradient(135deg,var(--a1),var(--a2));color:#06112a;font-weight:700;border-radius:12px;padding:11px;text-align:center}
.list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px}
.item{display:flex;align-items:center;gap:6px;border-radius:10px;padding:9px 10px;color:var(--muted);text-align:left}
.item span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.item:hover,.item.on{background:var(--panel2);color:var(--text)}
.item .del{opacity:0;padding:2px 6px;border-radius:6px}
.item:hover .del,.item.on .del{opacity:.8}
.item .del:hover{background:#3a2040;color:var(--danger)}
.foot{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.foot a{color:var(--muted);text-decoration:none;padding:6px 4px}
.foot a:hover{color:var(--text)}
.user{display:flex;justify-content:space-between;align-items:center;color:var(--muted)}
.timer{font-variant-numeric:tabular-nums;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--text)}
/* main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:none;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.top button{font-size:22px;padding:2px 8px}
.msgs{flex:1;overflow:auto;padding:24px 16px 8px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;gap:12px;line-height:1.65}
.msg.user{flex-direction:row-reverse}
.av{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px}
.msg.bot .av{background:linear-gradient(135deg,var(--a1),var(--a2));color:#06112a}
.msg.user .av{background:var(--user)}
.bub{max-width:calc(100% - 48px);padding:11px 15px;border-radius:16px;overflow-wrap:anywhere;font-size:15.5px}
.msg.bot .bub{background:var(--panel);border:1px solid var(--line)}
.msg.user .bub{background:var(--user)}
.bub p{margin:0 0 8px}.bub p:last-child{margin:0}
.bub ul,.bub ol{margin:6px 0 8px 22px}
.bub code{background:#0a0e1f;padding:1px 6px;border-radius:6px;font-family:ui-monospace,Consolas,monospace;font-size:.9em}
.bub h3,.bub h4{margin:10px 0 6px}
.code{margin:8px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;direction:ltr;text-align:left}
.code .bar{display:flex;justify-content:space-between;background:#0d1230;padding:6px 12px;font-size:12px;color:var(--muted)}
.code pre{background:#080b1a;padding:12px;overflow:auto;font-family:ui-monospace,Consolas,monospace;font-size:13.5px;line-height:1.5}
.code pre code{background:none;padding:0}
.cp:hover{color:var(--a2)}
.hint{margin-top:10px;font-size:14px;background:#0f2a3a;border:1px solid #1d5c78;border-radius:12px;padding:9px 12px}
.hint a{color:var(--a2);font-weight:600}
.dots{display:inline-flex;gap:5px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-4px)}}
.err{color:var(--danger)}
/* welcome */
.welcome{max-width:780px;margin:8vh auto 0;text-align:center;padding:0 8px}
.welcome h1{font-size:clamp(26px,4.5vw,40px);margin-bottom:8px;letter-spacing:-.02em}
.welcome p{color:var(--muted);margin-bottom:22px}
.sug{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;text-align:left}
.sug button{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;color:var(--muted);line-height:1.4}
.sug button:hover{border-color:var(--a1);color:var(--text)}
/* composer */
.comp{padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.box{max-width:780px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px 8px 8px 16px}
.box:focus-within{border-color:var(--a1)}
textarea{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;resize:none;max-height:180px;padding:7px 0;line-height:1.5}
textarea::placeholder{color:#7d86b5}
.send{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#06112a;font-size:18px;font-weight:700;flex:none}
.send:disabled{opacity:.4;cursor:not-allowed}
.note{text-align:center;font-size:12px;color:#7d86b5;margin-top:8px}
/* sleep */
.sleep{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;background:radial-gradient(circle at 50% 30%,#1b1f55,#05071a 70%)}
.sleep.on{display:flex}
.moon{width:90px;height:90px;border-radius:50%;box-shadow:inset -22px -6px 0 0 #f4f1d6;filter:drop-shadow(0 0 22px #f4f1d655)}
.sleep p{color:var(--muted)}
.sleep b{font-size:34px;font-variant-numeric:tabular-nums}
.stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),radial-gradient(2px 2px at 85% 65%,#fff,transparent),radial-gradient(1.5px 1.5px at 35% 75%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 50%,#fff,transparent);opacity:.7}
@media(max-width:800px){
.side{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);width:84%;max-width:310px}
.side.open{transform:none}
.top{display:flex}
.scrim{position:fixed;inset:0;background:#0008;z-index:15;display:none}.scrim.on{display:block}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<aside class="side" id="side">
  <div class="brand"><img src="logopng.png" alt="XP.ma"> ChatXp</div>
  <button class="new" id="newBtn">+ New chat</button>
  <div class="list" id="list"></div>
  <div class="foot">
    <div class="user"><span id="uname">…</span><span class="timer" id="timer" title="Time left today">--:--</span></div>
    <a href="dashboard.html">Dashboard</a>
    <a href="education.html">Education</a>
    <a href="programming.html">Programming</a>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<section class="main">
  <div class="top"><button id="menu" aria-label="Open menu">☰</button><b>ChatXp</b></div>
  <div class="msgs" id="msgs"><div class="wrap" id="wrap"></div></div>
  <div class="comp">
    <div class="box">
      <textarea id="inp" rows="1" placeholder="Ask ChatXp anything…" dir="auto"></textarea>
      <button class="send" id="send" aria-label="Send">➤</button>
    </div>
    <div class="note">ChatXp can make mistakes. Double-check important information.</div>
  </div>
</section>

<div class="sleep" id="sleep">
  <div class="stars"></div><div class="moon"></div>
  <h2>Time for a rest</h2>
  <p>You used today's 4 hours. XP.ma opens again in</p>
  <b id="sleepCd">--:--:--</b>
</div>

<script>
/* ====== CONFIG — fill the key once ====== */
const SUPABASE_URL = "https://fiftnztuwqedvjbiuwyo.supabase.co";
const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE"; // same one used in dashboard.html (never the service_role key)
const FUNCTION_NAME = "chat-ai";
const SYSTEM_PROMPT = "You are ChatXp, the AI assistant of XP.ma, a platform made in Morocco. Be helpful, clear and friendly. Always answer in the language the user writes in: Moroccan Darija (Arabic or Latin letters), Arabic, French or English. If the question is about school subjects, answer it normally.";

/* ====== SESSION (reads what login.html saved) ====== */
function readSession(){
  let token=null,username=null;
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i),v=localStorage.getItem(k);
    let o=null; try{o=JSON.parse(v)}catch(e){}
    if(o&&typeof o==="object"){
      token=token||o.token||o.session_token||o.sessionToken||o.p_token||(o.session&&(o.session.token||o.session.session_token));
      username=username||o.username||(o.user&&o.user.username);
    }else if(typeof v==="string"){
      if(/token/i.test(k)&&v.length>15)token=token||v;
      if(/user(name)?$/i.test(k)&&v.length<40)username=username||v;
    }
  }
  return {token,username};
}
const S=readSession();
if(!S.token){location.replace("login.html");}
const USER=S.username||"friend";
document.getElementById("uname").textContent=USER;

/* ====== STATE ====== */
const KEY="chatxp_chats_"+USER;
let chats=[];try{chats=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
let cur=null,busy=false;
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(chats))}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ====== MARKDOWN (small, safe) ====== */
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(t){
  const blocks=[];
  t=t.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>{blocks.push(`<div class="code"><div class="bar"><span>${esc(l||"code")}</span><button class="cp">Copy</button></div><pre><code>${esc(c.replace(/\n$/,""))}</code></pre></div>`);return "\u0000"+(blocks.length-1)+"\u0000"});
  t=esc(t).replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>");
  const out=[];let list=null;
  for(const raw of t.split("\n")){
    const ul=raw.match(/^\s*[-*•]\s+(.*)/),ol=raw.match(/^\s*\d+[.)]\s+(.*)/),h=raw.match(/^#{1,4}\s+(.*)/);
    if(ul||ol){const tag=ul?"ul":"ol";if(list!==tag){if(list)out.push(`</${list}>`);out.push(`<${tag}>`);list=tag}out.push(`<li>${(ul||ol)[1]}</li>`);continue}
    if(list){out.push(`</${list}>`);list=null}
    if(h)out.push(`<h3>${h[1]}</h3>`);else if(raw.trim())out.push(`<p>${raw}</p>`);
  }
  if(list)out.push(`</${list}>`);
  return out.join("").replace(/\u0000(\d+)\u0000/g,(m,i)=>blocks[i]).replace(/<p>(<div class="code">[\s\S]*?<\/div>)<\/p>/g,"$1");
}

/* ====== RENDER ====== */
function renderList(){
  const l=$("list");l.innerHTML="";
  chats.slice().sort((a,b)=>b.updated-a.updated).forEach(c=>{
    const d=document.createElement("div");d.className="item"+(cur&&cur.id===c.id?" on":"");d.tabIndex=0;
    d.innerHTML=`<span dir="auto">${esc(c.title)}</span><button class="del" aria-label="Delete chat">✕</button>`;
    d.onclick=e=>{if(e.target.classList.contains("del")){chats=chats.filter(x=>x.id!==c.id);save();if(cur&&cur.id===c.id)cur=null;renderList();renderChat()}else{cur=c;renderList();renderChat();closeMenu()}};
    d.onkeydown=e=>{if(e.key==="Enter")d.click()};
    l.appendChild(d);
  });
}
function bubble(role,html){
  const m=document.createElement("div");m.className="msg "+(role==="user"?"user":"bot");
  m.innerHTML=`<div class="av">${role==="user"?esc(USER[0].toUpperCase()):"XP"}</div><div class="bub" dir="auto">${html}</div>`;
  $("wrap").appendChild(m);return m;
}
const SUGGEST=["Explain photosynthesis simply","Chrh liya l-recursion b Darija","Aide-moi à écrire un email professionnel","Give me a 7-day study plan"];
function renderChat(){
  const w=$("wrap");w.innerHTML="";
  if(!cur||!cur.messages.length){
    w.innerHTML=`<div class="welcome"><h1>Salam ${esc(USER)} 👋</h1><p>Ask me anything, in Darija, Arabic, French or English.</p><div class="sug"></div></div>`;
    SUGGEST.forEach(s=>{const b=document.createElement("button");b.textContent=s;b.onclick=()=>{$("inp").value=s;send()};w.querySelector(".sug").appendChild(b)});
  }else cur.messages.forEach(m=>bubble(m.role,m.role==="user"?esc(m.content).replace(/\n/g,"<br>"):md(m.content)));
  scrollDown();
}
const scrollDown=()=>{const m=$("msgs");m.scrollTop=m.scrollHeight};

/* ====== SEND ====== */
const SCHOOL=/(exam|devoir|math|physique|chimie|svt|biolog|histoire|geo|cours|exercice|bac\b|lycée|3amer|tamrin|derss|9raya|امتحان|درس|تمرين|رياضيات|فيزياء|مدرسة)/i;
function pickReply(d){
  if(typeof d==="string")return d;
  if(!d)return "";
  return d.reply||d.response||d.text||d.message||d.answer||d.output||(d.choices&&d.choices[0]&&(d.choices[0].message?d.choices[0].message.content:d.choices[0].text))||(d.content&&(Array.isArray(d.content)?d.content.map(x=>x.text||"").join(""):d.content))||"";
}
async function send(){
  const inp=$("inp"),text=inp.value.trim();
  if(!text||busy)return;
  if(!cur){cur={id:uid(),title:text.slice(0,40),messages:[],updated:Date.now()};chats.push(cur)}
  cur.messages.push({role:"user",content:text});cur.updated=Date.now();save();
  inp.value="";inp.style.height="auto";renderList();renderChat();
  busy=true;$("send").disabled=true;
  const typing=bubble("bot",'<span class="dots"><i></i><i></i><i></i></span>');scrollDown();
  try{
    const r=await fetch(`${SUPABASE_URL}/functions/v1/${FUNCTION_NAME}`,{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY},
      body:JSON.stringify({token:S.token,p_token:S.token,system:SYSTEM_PROMPT,messages:cur.messages.slice(-20)})
    });
    let d=null;const raw=await r.text();try{d=JSON.parse(raw)}catch(e){d=raw}
    if(!r.ok){const m=(d&&(d.error&&(d.error.message||d.error)||d.message))||raw;throw new Error(typeof m==="string"?m:JSON.stringify(m))}
    const reply=pickReply(d).trim();
    if(!reply)throw new Error("Empty reply from server.");
    cur.messages.push({role:"assistant",content:reply});cur.updated=Date.now();save();
    typing.remove();const m=bubble("assistant",md(reply));
    if(SCHOOL.test(text)){const h=document.createElement("div");h.className="hint";h.innerHTML='📚 School question? Try the <a href="education.html">Education page</a> for step-by-step help.';m.querySelector(".bub").appendChild(h)}
  }catch(e){
    typing.remove();
    let msg=String(e.message||e);
    if(/credit|quota|billing|insufficient/i.test(msg))msg="ChatXp's AI service has no credit left right now. The team is working on it.";
    bubble("assistant",`<span class="err">⚠ ${esc(msg)}</span>`);
  }
  busy=false;$("send").disabled=false;scrollDown();inp.focus();
}

/* ====== EVENTS ====== */
$("send").onclick=send;
$("inp").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();send()}});
$("inp").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,180)+"px"});
$("newBtn").onclick=()=>{cur=null;renderList();renderChat();closeMenu();$("inp").focus()};
$("wrap").addEventListener("click",e=>{if(e.target.classList.contains("cp")){const c=e.target.closest(".code").querySelector("code").textContent;navigator.clipboard&&navigator.clipboard.writeText(c);e.target.textContent="Copied";setTimeout(()=>e.target.textContent="Copy",1500)}});
const openMenu=()=>{$("side").classList.add("open");$("scrim").classList.add("on")};
const closeMenu=()=>{$("side").classList.remove("open");$("scrim").classList.remove("on")};
$("menu").onclick=openMenu;$("scrim").onclick=closeMenu;

/* ====== DAILY TIMER (server is the authority) ====== */
let left=null;
async function rpc(fn){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY},body:JSON.stringify({p_token:S.token})});
  if(!r.ok)throw new Error(fn+" "+r.status);return r.json();
}
function secondsFrom(d){
  if(Array.isArray(d))d=d[0];
  if(typeof d==="number")return d;
  if(d&&typeof d==="object"){for(const k of ["remaining_seconds","seconds_left","remaining","left_seconds","seconds_remaining"])if(typeof d[k]==="number")return d[k]}
  return null;
}
const hms=s=>{s=Math.max(0,Math.floor(s));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,"0")).join(":")};
function showTimer(){
  if(left===null)return;
  $("timer").textContent=hms(left).slice(0,5);
  if(left<=0){$("sleep").classList.add("on");const n=new Date(),t=new Date(n);t.setHours(24,0,0,0);$("sleepCd").textContent=hms((t-n)/1000)}
}
async function sync(fn){try{const s=secondsFrom(await rpc(fn));if(s!==null){left=s;showTimer()}}catch(e){console.warn(e)}}
sync("get_xp_timer");
setInterval(()=>{if(left!==null&&left>0){left--;showTimer()}else if(left!==null)showTimer()},1000);
setInterval(()=>{if(!document.hidden)sync("xp_timer_heartbeat")},10000);

renderList();renderChat();
</script>
</body>
</html>
