<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>XP.ma — Create Account</title>

    <link rel="icon" type="image/png" href="logopng.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;

            font-family: Arial, Helvetica, sans-serif;
            color: white;

            background:
                radial-gradient(circle at 20% 10%, rgba(80,80,80,0.35), transparent 30%),
                radial-gradient(circle at 80% 90%, rgba(40,40,40,0.4), transparent 30%),
                #050505;
        }

        .back {
            position: fixed;
            top: 25px;
            left: 25px;

            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: white;
        }

        .signup-card {
            width: 100%;
            max-width: 440px;
            padding: 40px;

            border-radius: 24px;

            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);

            backdrop-filter: blur(20px);

            box-shadow: 0 20px 70px rgba(0,0,0,0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo img {
            width: 125px;
            height: auto;
        }

        h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cfcfcf;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 15px;

            border-radius: 11px;
            border: 1px solid rgba(255,255,255,0.12);
            outline: none;

            background: rgba(0,0,0,0.35);
            color: white;

            font-size: 15px;
        }

        input::placeholder {
            color: #666;
        }

        input:focus {
            border-color: rgba(255,255,255,0.45);
        }

        .signup-button {
            width: 100%;
            margin-top: 8px;
            padding: 15px;

            border: none;
            border-radius: 12px;

            background: white;
            color: black;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.3s;
        }

        .signup-button:hover {
            transform: translateY(-2px);
            background: #ddd;
        }

        .signup-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;

            border-radius: 10px;

            font-size: 13px;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: rgba(0,255,120,0.08);
            border: 1px solid rgba(0,255,120,0.2);
            color: #7dffb2;
        }

        .message.error {
            display: block;
            background: rgba(255,50,50,0.08);
            border: 1px solid rgba(255,50,50,0.2);
            color: #ff8585;
        }

        .login-text {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

        .login-text a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .signup-card {
                padding: 30px 22px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <a href="index.html" class="back">
        ← Back to XP.ma
    </a>

    <div class="signup-card">

        <div class="logo">
            <img src="assets/logo.png" alt="XP.ma">
        </div>

        <h1>Create your account</h1>

        <p class="subtitle">
            Join XP.ma and start using AI tools.
        </p>

        <form id="signupForm">

            <div class="form-group">
                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Your name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    Confirm password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Repeat your password"
                    minlength="6"
                    required
                >
            </div>

            <button
                type="submit"
                class="signup-button"
                id="signupButton"
            >
                Create account →
            </button>

        </form>

        <div id="message" class="message"></div>

        <p class="login-text">
            Already have an account?
            <a href="login.html">Sign in</a>
        </p>

    </div>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>


        const SUPABASE_URL = "https://fiftnztuwqedvjbiuwyo.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_JvMn1Bd1wgpPJ9Mw_Wphzg_TJNInEqR";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* =========================================
           FORM
        ========================================= */

        const signupForm =
            document.getElementById("signupForm");

        const signupButton =
            document.getElementById("signupButton");

        const message =
            document.getElementById("message");


        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message " + type;
        }


        signupForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const name =
                    document.getElementById("name").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;


                /* Password check */

                if (password !== confirmPassword) {

                    showMessage(
                        "Passwords do not match.",
                        "error"
                    );

                    return;
                }


                signupButton.disabled = true;

                signupButton.textContent =
                    "Creating account...";


                try {

                    const {
                        data,
                        error
                    } = await supabaseClient.auth.signUp({

                        email: email,

                        password: password,

                        options: {

                            emailRedirectTo:
                                "https://bnx-team.github.io/XP.ma/login.html",

                            data: {
                                name: name
                            }
                        }
                    });


                    if (error) {

                        showMessage(
                            error.message,
                            "error"
                        );

                        return;
                    }


                    /*
                        Supabase will send the
                        verification email when
                        Confirm Email is enabled.
                    */

                    showMessage(
                        "Account created! Check your email and click the verification link before signing in.",
                        "success"
                    );


                    signupForm.reset();


                } catch (error) {

                    showMessage(
                        "Something went wrong. Please try again.",
                        "error"
                    );

                } finally {

                    signupButton.disabled = false;

                    signupButton.textContent =
                        "Create account →";
                }

            }
        );

    </script>

</body>
</html>
