<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>XP.ma — Create Account</title>

    <link rel="icon" type="image/png" href="assets/logo-icon.png">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            font-family: Arial, Helvetica, sans-serif;
            color: white;

            background:
                radial-gradient(
                    circle at 20% 10%,
                    rgba(80,80,80,0.35),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 90%,
                    rgba(40,40,40,0.4),
                    transparent 30%
                ),
                #050505;
        }

        .back {
            position: fixed;
            top: 25px;
            left: 25px;

            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: white;
        }

        .signup-card {
            width: 100%;
            max-width: 440px;

            padding: 40px;

            border-radius: 24px;

            background: rgba(255,255,255,0.06);

            border: 1px solid rgba(255,255,255,0.12);

            backdrop-filter: blur(20px);

            box-shadow:
                0 20px 70px rgba(0,0,0,0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo img {
            width: 125px;
            height: auto;
        }

        h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cfcfcf;
            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 14px 15px;

            border-radius: 11px;

            border: 1px solid rgba(255,255,255,0.12);

            outline: none;

            background: rgba(0,0,0,0.35);

            color: white;

            font-size: 15px;
        }

        input::placeholder {
            color: #666;
        }

        input:focus {
            border-color: rgba(255,255,255,0.45);
        }

        .signup-button {
            width: 100%;

            margin-top: 8px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: white;

            color: black;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .signup-button:hover {
            transform: translateY(-2px);
            background: #ddd;
        }

        .signup-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 10px;

            font-size: 13px;

            line-height: 1.5;
        }

        .message.success {
            display: block;

            background: rgba(0,255,120,0.08);

            border: 1px solid rgba(0,255,120,0.2);

            color: #7dffb2;
        }

        .message.error {
            display: block;

            background: rgba(255,50,50,0.08);

            border: 1px solid rgba(255,50,50,0.2);

            color: #ff8585;
        }

        .login-text {
            text-align: center;

            margin-top: 25px;

            color: #777;

            font-size: 14px;
        }

        .login-text a {
            color: white;

            text-decoration: none;

            font-weight: bold;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {

            .signup-card {
                padding: 30px 22px;
            }

            h1 {
                font-size: 26px;
            }

        }

    </style>

</head>

<body>


    <a href="index.html" class="back">
        ← Back to XP.ma
    </a>


    <div class="signup-card">


        <div class="logo">

            <img
                src="assets/logo.png"
                alt="XP.ma"
            >

        </div>


        <h1>
            Create your account
        </h1>


        <p class="subtitle">
            Join XP.ma and start using AI tools.
        </p>


        <form id="signupForm">


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Choose a username"
                    minlength="3"
                    maxlength="20"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Repeat your password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="signup-button"
                id="signupButton"
            >
                Create account →
            </button>


        </form>


        <div
            id="message"
            class="message"
        ></div>


        <p class="login-text">

            Already have an account?

            <a href="login.html">
                Sign in
            </a>

        </p>


    </div>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>


        /* =========================================
           XP.ma SUPABASE CONFIG
        ========================================= */

        const SUPABASE_URL =
            "YOUR_SUPABASE_PROJECT_URL";

        const SUPABASE_PUBLISHABLE_KEY =
            "YOUR_SUPABASE_PUBLISHABLE_KEY";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* =========================================
           ELEMENTS
        ========================================= */

        const signupForm =
            document.getElementById("signupForm");

        const signupButton =
            document.getElementById("signupButton");

        const message =
            document.getElementById("message");


        /* =========================================
           MESSAGE
        ========================================= */

        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message " + type;
        }


        /* =========================================
           USERNAME
        ========================================= */

        function cleanUsername(username) {

            return username
                .trim()
                .toLowerCase();
        }


        /* =========================================
           SIGN UP
        ========================================= */

        signupForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const username =
                    cleanUsername(
                        document.getElementById("username").value
                    );


                const password =
                    document.getElementById("password").value;


                const confirmPassword =
                    document.getElementById("confirmPassword").value;


                /* Username validation */

                const usernameRegex =
                    /^[a-z0-9_]+$/;


                if (!usernameRegex.test(username)) {

                    showMessage(
                        "Username can only contain letters, numbers and underscores.",
                        "error"
                    );

                    return;
                }


                /* Password validation */

                if (password !== confirmPassword) {

                    showMessage(
                        "Passwords do not match.",
                        "error"
                    );

                    return;
                }


                signupButton.disabled = true;

                signupButton.textContent =
                    "Creating account...";


                try {

                    /*
                        Supabase needs an email internally.

                        The user never sees this email.
                    */

                    const internalEmail =
                        username +
                        "@users.xpma.local";


                    const {
                        data,
                        error
                    } =
                        await supabaseClient.auth.signUp({

                            email: internalEmail,

                            password: password,

                            options: {

                                data: {
                                    username: username
                                }

                            }

                        });


                    if (error) {

                        showMessage(
                            error.message,
                            "error"
                        );

                        return;
                    }


                    if (!data.user) {

                        showMessage(
                            "Account could not be created.",
                            "error"
                        );

                        return;
                    }


                    showMessage(
                        "Account created successfully! Redirecting...",
                        "success"
                    );


                    setTimeout(function() {

                        window.location.href =
                            "dashboard.html";

                    }, 1000);


                } catch (error) {

                    console.error(error);

                    showMessage(
                        "Something went wrong. Please try again.",
                        "error"
                    );

                } finally {

                    signupButton.disabled = false;

                    signupButton.textContent =
                        "Create account →";

                }

            }
        );

    </script>

</body>

</html>
